<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Northstar</title>

    <meta name="description"
        content="Northstar - Always a better direction.">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="background"></div>

    <header>

        <div class="logo">

            <div class="star">
                ✦
            </div>

            <h1>Northstar</h1>

            <p>Always a better direction.</p>

        </div>

    </header>

    <main>

        <section class="hero">

            <span class="badge">
                DISCOVER • LEARN • CREATE
            </span>

            <h2>
                O que gostarias de fazer hoje?
            </h2>

            <p class="subtitle">

                Pequenas escolhas positivas podem mudar completamente o rumo do teu dia.

            </p>

        </section>

        <section class="categories">

            <button class="card">
                🧠
                <span>Aprender</span>
            </button>

            <button class="card">
                🌍
                <span>Explorar</span>
            </button>

            <button class="card">
                🎮
                <span>Jogar</span>
            </button>

            <button class="card">
                🎨
                <span>Criar</span>
            </button>

            <button class="card">
                🙏
                <span>Refletir</span>
            </button>

            <button class="card highlight" id="surprise-btn">
                🎲
                <span>Surpreende-me</span>
            </button>

        </section>

        <section class="daily">

            <h3>Today's Discovery</h3>

            <p id="daily-text">

                Amanhã este espaço mostrará um desafio diferente todos os dias.

            </p>

        </section>

    </main>

    <footer>

        <small>

            Northstar v0.1 • Built with curiosity.

        </small>

    </footer>

    <script src="js/app.js"></script>

</body>

</html>
