<!DOCTYPE html>
<html lang="pt-PT">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Northstar</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="background"></div>

    <header>

        <div class="logo">

            <div class="star">✦</div>

            <h1>Northstar</h1>

            <p>Always a better direction.</p>

        </div>

    </header>

    <main>

        <nav class="navigation">

            <button class="nav-button active">
                Início
            </button>

            <button class="nav-button">
                Jornadas
            </button>

            <button class="nav-button">
                Descobrir
            </button>

            <button class="nav-button">
                Perfil
            </button>

        </nav>

        <section class="hero">

            <span class="badge">

                DISCOVER • LEARN • CREATE

            </span>

            <h2 id="greeting">

                Bem-vindo!

            </h2>

            <p id="quote">

                Há sempre uma direção melhor.

            </p>

        </section>

        <section class="quick-grid">

            <button id="five-minutes" class="feature-card">

                <h3>🌱 Só 5 minutos</h3>

                <p>
                    Uma pequena descoberta para quando tens pouco tempo.
                </p>

            </button>

            <button id="surprise" class="feature-card primary">

                <h3>🎲 Surpreende-me</h3>

                <p>
                    Escolhe um recurso completamente ao acaso.
                </p>

            </button>

        </section>

        <section class="categories">

            <button class="category-card">🧠 Aprender</button>

            <button class="category-card">🌍 Explorar</button>

            <button class="category-card">🎨 Criar</button>

            <button class="category-card">🎮 Jogar</button>

            <button class="category-card">🙏 Refletir</button>

        </section>

        <section class="discovery">

            <h3>

                💡 Descoberta do dia

            </h3>

            <p id="daily-discovery">

                A carregar...

            </p>

        </section>

    </main>

    <div id="modal" class="modal">

        <div class="modal-content">

            <button id="close-modal" class="close-button">

                ✕

            </button>

            <span id="modal-category" class="category-badge">

                Explorar

            </span>

            <h2 id="modal-title">

                Radio Garden

            </h2>

            <p id="modal-description">

                Descrição

            </p>

            <p id="modal-time">

                ⏱️ 10 minutos

            </p>

            <div class="modal-actions">

                <button id="open-site">

                    Explorar

                </button>

                <button id="another-site">

                    Outra sugestão

                </button>

            </div>

        </div>

    </div>

    <script src="js/sites.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
