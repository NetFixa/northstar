<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Northstar</title>

    <meta name="description"
        content="Northstar - Always a better direction.">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="background"></div>

    <header>

        <div class="logo">

            <div class="star">
                ✦
            </div>

            <h1>Northstar</h1>

            <p>Always a better direction.</p>

        </div>

    </header>

    <main id="app">

    <nav class="top-nav">

        <button class="nav-item active">
            🏠
            <span>Início</span>
        </button>

        <button class="nav-item">
            🧭
            <span>Jornadas</span>
        </button>

        <button class="nav-item">
            📚
            <span>Descobrir</span>
        </button>

        <button class="nav-item">
            👤
            <span>Perfil</span>
        </button>

    </nav>

    <section id="page-home">

        <section class="hero">

            <span class="badge">
                DISCOVER • LEARN • CREATE
            </span>

            <h2>Bom dia ☀️</h2>

            <p class="subtitle">

                Pequenas escolhas positivas podem mudar completamente o teu dia.

            </p>

        </section>

        <section class="quick-actions">

            <button class="primary-action">

                🌱

                <div>

                    <strong>Só 5 minutos</strong>

                    <small>Uma descoberta rápida.</small>

                </div>

            </button>

            <button class="primary-action highlight" id="surprise-btn">

                🎲

                <div>

                    <strong>Surpreende-me</strong>

                    <small>Escolha totalmente aleatória.</small>

                </div>

            </button>

        </section>

        <section class="categories">

            <button class="card">

                🧠

                <span>Aprender</span>

            </button>

            <button class="card">

                🌍

                <span>Explorar</span>

            </button>

            <button class="card">

                🎮

                <span>Jogar</span>

            </button>

            <button class="card">

                🎨

                <span>Criar</span>

            </button>

            <button class="card">

                🙏

                <span>Refletir</span>

            </button>

        </section>

        <section class="daily">

            <h3>💡 Descoberta do dia</h3>

            <p id="daily-text">

                A carregar...

            </p>

        </section>

    </section>

</main>

    <footer>

        <small>

            Northstar v0.1 • Built with curiosity.

        </small>

    </footer>

    <script src="js/app.js"></script>

</body>

</html>
